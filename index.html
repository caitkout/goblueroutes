<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoBlue Routes — Your week, mapped.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Public+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{
  --blue:#00274c;
  --blue-2:#0b3b68;
  --maize:#ffcb05;
  --ink:#122033;
  --muted:#64748b;
  --paper:#ffffff;
  --paper-2:#f7f9fc;
  --line:#e5eaf0;
  --soft:#eef3f8;
  --green:#147a50;
  --yellow:#9a6a00;
  --red:#b42318;
  --shadow:0 18px 55px rgba(18,32,51,.08);
  --shadow-sm:0 7px 25px rgba(18,32,51,.07);
  --radius:18px;
  --radius-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  --display:"Fraunces", Georgia, serif;
  --ui:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); color:var(--ink); background:
  radial-gradient(circle at 92% 4%,rgba(255,203,5,.13),transparent 18rem),
  linear-gradient(180deg,#fff 0%,#fff 62%,#f7f9fc 100%);
  line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit}
a{color:inherit}
::selection{background:var(--maize);color:var(--blue)}
.container{max-width:1160px;margin:auto;padding:0 24px}
.hidden{display:none!important}

/* distinctive editorial header */
.site-header{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
}
.nav{height:74px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em;cursor:pointer}
.brand-mark{
  width:36px;height:36px;border-radius:11px 11px 11px 4px;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:4px 5px 0 var(--maize);transform:rotate(-3deg)
}
.brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--maize);right:7px;top:7px}
.brand-mark span{font-family:var(--mono);font-size:13px;font-weight:700}
.nav-links{display:flex;gap:5px;align-items:center}
.nav-btn{
  border:0;background:transparent;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:700;
  color:var(--muted);cursor:pointer;transition:.2s var(--ease)
}
.nav-btn:hover{background:var(--soft);color:var(--blue)}
.nav-btn.active{background:var(--blue);color:#fff}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;
  padding:13px 20px;font-size:14px;font-weight:800;cursor:pointer;transition:.18s var(--ease);
  letter-spacing:-.01em
}
.btn:active{transform:scale(.98)}
.btn-maize{background:var(--maize);color:var(--blue);box-shadow:0 8px 20px rgba(255,203,5,.24)}
.btn-maize:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(255,203,5,.3)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(0,39,76,.15)}
.btn-primary:hover{background:var(--blue-2);transform:translateY(-1px)}
.btn-ghost{background:#fff;color:var(--blue);border:1px solid #cfd8e3}
.btn-ghost:hover{background:var(--soft);border-color:#b8c5d3}
.btn-sm{padding:9px 14px;font-size:12px;border-radius:9px}
.btn-danger{background:#fff1f0;color:var(--red);border:1px solid #f2c7c4}
.btn-block{width:100%}

/* landing */
.hero{position:relative;padding:105px 0 95px;overflow:hidden}
.hero:before{
  content:"";position:absolute;left:-140px;top:30px;width:310px;height:310px;border:1px solid #dbe4ed;
  border-radius:50%;opacity:.8
}
.hero:after{
  content:"";position:absolute;right:-110px;bottom:0;width:280px;height:280px;
  background:linear-gradient(135deg,transparent 49%,var(--maize) 50%,var(--maize) 53%,transparent 54%);
  opacity:.18;pointer-events:none
}
.hero .container{position:relative;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;border:1px solid #d7e0e9;background:#fff;
  color:var(--blue);font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:8px 12px;border-radius:6px;margin-bottom:25px;
  box-shadow:var(--shadow-sm)
}
.hero h1{
  max-width:850px;margin:0 auto 22px;font-family:var(--display);font-size:68px;line-height:.98;
  font-weight:500;letter-spacing:-.045em;color:var(--blue)
}
.hero h1 .accent{
  color:var(--blue);font-style:italic;position:relative;white-space:nowrap
}
.hero h1 .accent:after{
  content:"";position:absolute;left:2%;right:-3%;bottom:-5px;height:7px;
  background:var(--maize);z-index:-1;transform:skewX(-16deg)
}
.hero p.sub{max-width:610px;margin:0 auto 34px;color:#536579;font-size:18px}
.hero-ctas{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.hero-note{margin-top:18px;color:#8a98a8;font:10px var(--mono);letter-spacing:.04em}

.section{padding:76px 0;border-top:1px solid var(--line)}
.section h2{font:500 34px var(--display);letter-spacing:-.035em;color:var(--blue);margin:0 0 10px}
.section p.lead{font-size:15px;color:var(--muted);max-width:620px;margin:0 0 38px}

.landing-preview{
  max-width:930px;margin:0 auto;border:1px solid #dce4ec;border-radius:22px;background:#fff;
  box-shadow:var(--shadow);overflow:hidden;transform:rotate(-.35deg)
}
.landing-preview-bar{height:38px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;gap:6px;background:#fbfcfd}
.dot{width:8px;height:8px;border-radius:50%;background:#d6dee7}
.landing-preview-body{padding:25px;display:grid;grid-template-columns:1fr 1.35fr;gap:20px}
.mini-timeline .mini-row{
  display:flex;gap:11px;padding:13px 0;border-bottom:1px dashed #dfe6ee;font:12px var(--mono);color:var(--muted)
}
.mini-timeline .mini-row b{color:var(--blue)}
.mini-map{
  min-height:185px;border-radius:14px;background:
  linear-gradient(135deg,#f4f7fa 0%,#fff 100%);
  border:1px solid #e0e7ef;display:flex;align-items:center;justify-content:center;
  color:var(--blue);font:11px var(--mono);position:relative;overflow:hidden
}
.mini-map:before,.mini-map:after{content:"";position:absolute;border:2px solid var(--maize);border-radius:50%;width:180px;height:90px;transform:rotate(-25deg)}
.mini-map:after{width:260px;height:70px;border-color:#d7e1ea;transform:rotate(22deg)}
.mini-map{isolation:isolate}
.mini-map::first-line{position:relative;z-index:2}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feature-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:23px;
  transition:.2s var(--ease);position:relative;overflow:hidden
}
.feature-card:after{content:"";position:absolute;left:0;bottom:0;width:42px;height:3px;background:var(--maize);transition:.25s var(--ease)}
.feature-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#ccd7e2}
.feature-card:hover:after{width:100%}
.feature-card .icon{
  width:42px;height:42px;border-radius:10px;background:#f2f6fa;border:1px solid #dfe7ef;
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:18px
}
.feature-card h3{font-size:15px;margin:0 0 6px;color:var(--blue)}
.feature-card p{font-size:13px;color:var(--muted);margin:0}

.site-footer{border-top:1px solid var(--line);padding:34px 0;color:#8794a3;font-size:11px;text-align:center}

/* pages */
.page{padding:45px 0 85px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:28px}
.page-head h1{font:500 34px var(--display);letter-spacing:-.035em;color:var(--blue);margin:0 0 4px}
.page-head p{margin:0;color:var(--muted);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 3px 16px rgba(18,32,51,.025)}
.pad{padding:22px}

/* forms */
.builder-grid{display:grid;grid-template-columns:1fr 390px;gap:18px;align-items:start}
.class-list{display:flex;flex-direction:column;gap:9px}
.class-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:15px 16px;transition:.18s var(--ease)
}
.class-item:hover{border-color:#cbd7e2;box-shadow:var(--shadow-sm);transform:translateX(2px)}
.class-item .title{font-weight:800;font-size:14px;color:var(--blue)}
.class-item .meta{font:11px var(--mono);color:var(--muted);margin-top:4px}
.day-pills{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.day-pill{font:9px var(--mono);font-weight:700;background:#f0f4f8;color:#536579;padding:3px 7px;border-radius:5px}
.item-actions{display:flex;gap:5px}
.icon-btn{background:#fff;border:1px solid #dce4ec;border-radius:8px;width:31px;height:31px;cursor:pointer;color:#64748b}
.icon-btn:hover{background:var(--soft);color:var(--blue)}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed #cfd9e3;border-radius:15px;background:#fbfcfd}
.empty-state .big{font-size:30px;margin-bottom:8px}
.form-row{margin-bottom:15px}
.form-row label{display:block;font:9px var(--mono);font-weight:700;color:#7b8999;margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}
.form-row input,.form-row select{
  width:100%;padding:11px 12px;border:1px solid #d7e0e9;border-radius:9px;font-size:13.5px;
  background:#fff;color:var(--ink);transition:.15s
}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,39,76,.08)}
.form-row input::placeholder{color:#a0acb9}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day-toggle-row{display:flex;gap:5px;flex-wrap:wrap}
.day-toggle{border:1px solid #d8e1e9;background:#fff;border-radius:8px;width:43px;height:37px;font:10px var(--mono);font-weight:700;color:#718093;cursor:pointer}
.day-toggle:hover{border-color:#b7c5d3}
.day-toggle.on{background:var(--blue);border-color:var(--blue);color:#fff}
.building-suggest{position:relative}
.suggest-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #d5dee7;border-radius:10px;box-shadow:var(--shadow);max-height:240px;overflow:auto;z-index:20;margin-top:5px}
.suggest-item{padding:10px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #eef2f5}
.suggest-item:hover{background:#f5f8fb}
.suggest-item small{display:block;color:#8997a7;font:9px var(--mono);margin-top:2px}
.upload-box{border:1.5px dashed #cbd7e2;border-radius:14px;padding:25px;text-align:center;background:#fbfcfd}
.upload-box input[type=file]{margin-top:13px;color:var(--muted);font-size:12px}
.warning-banner{background:#fff8df;border:1px solid #f0d47a;color:#7c5a00;border-radius:10px;padding:13px;font-size:13px;margin-bottom:16px}

/* tables */
.confirm-table{width:100%;border-collapse:collapse;font-size:13px}
.confirm-table th{text-align:left;color:#7b8999;font:9px var(--mono);text-transform:uppercase;letter-spacing:.07em;padding:9px;border-bottom:1px solid #cfd9e3}
.confirm-table td{padding:9px;border-bottom:1px solid #edf1f5}
.confirm-table input,.confirm-table select{border:1px solid #d7e0e9;border-radius:7px;padding:7px 8px;font-size:12px;width:100%;background:#fff;color:var(--ink)}
.tag-unknown{background:#fff0ef;color:var(--red);font:9px var(--mono);font-weight:700;padding:3px 7px;border-radius:5px}

/* weekly */
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.week-card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px;cursor:pointer;transition:.2s var(--ease);position:relative}
.week-card:before{content:"";position:absolute;top:0;left:16px;right:16px;height:3px;background:var(--maize);border-radius:0 0 4px 4px}
.week-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#ccd7e2}
.week-card h3{font:500 18px var(--display);color:var(--blue);margin:0 0 14px}
.week-stat{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font:10px var(--mono)}
.week-stat b{color:var(--ink)}
.tight-badge{display:inline-block;margin-top:10px;font:9px var(--mono);font-weight:700;padding:4px 8px;border-radius:5px}
.tight-badge.ok{background:#eaf7f0;color:var(--green)}
.tight-badge.warn{background:#fff5dd;color:var(--yellow)}

/* day view */
.day-tabs{display:flex;gap:5px;margin-bottom:22px;overflow-x:auto}
.day-tab{border:1px solid #d7e0e9;background:#fff;padding:9px 18px;border-radius:8px;font:10px var(--mono);font-weight:700;color:#6c7b8c;cursor:pointer}
.day-tab:hover{border-color:#b9c7d4}
.day-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.summary-tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.summary-tile .num{font:500 25px var(--display);color:var(--blue)}
.summary-tile .lab{font:9px var(--mono);color:#8a98a8;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.day-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
#map{width:100%;height:560px;border-radius:16px;border:1px solid #d8e1e9;overflow:hidden}
.timeline{display:flex;flex-direction:column}
.class-block{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.class-block .time{font:10px var(--mono);font-weight:700;color:var(--blue-2)}
.class-block .course{font:500 17px var(--display);color:var(--blue);margin:3px 0}
.class-block .loc{font-size:12.5px;color:var(--muted)}
.transition{margin:6px 0 6px 16px;padding:10px 12px;border-left:3px solid #dbe3eb;font-size:12px;border-radius:0 8px 8px 0}
.transition.green{border-color:#75c49d;background:#eff9f4;color:#176847}
.transition.yellow{border-color:#e5c15d;background:#fff9e8;color:#805f00}
.transition.red{border-color:#e28a83;background:#fff1f0;color:#a21d15}
.transition.campus-transfer{border-left-style:dashed}
.transition.unsupported{border-color:#cbd5df;border-left-style:dotted;background:#f7f9fb;color:#68788a}
.transition .headline{font-weight:800;font-size:12px}
.transition .leaveby{font:9px var(--mono);opacity:.82;margin-top:3px}
.transition .bus-badge{display:inline-flex;align-items:center;gap:4px;font:9px var(--mono);font-weight:700;padding:2px 7px;border-radius:5px;background:var(--maize);color:var(--blue);margin-right:5px}
.overlap-warning{background:#fff1f0;border:1px solid #f0c4c0;color:#a21d15;border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:15px}
.footnote{font:9.5px var(--mono);color:#8a98a8;margin-top:9px}
.badge-demo{background:var(--maize);color:var(--blue);font:9px var(--mono);font-weight:800;padding:3px 7px;border-radius:4px;margin-left:7px;vertical-align:middle}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,20,40,.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border:1px solid #dbe3eb;border-radius:17px;max-width:480px;width:100%;padding:25px;box-shadow:0 30px 90px rgba(0,20,40,.18)}
.modal h3{margin:0 0 6px;font:500 21px var(--display);color:var(--blue)}
.modal p{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}

/* leaflet refinements */
.leaflet-control-zoom a{color:var(--blue)!important}
.leaflet-control-attribution{font-size:8px!important}

/* responsive */
@media(max-width:900px){
  .hero{padding:80px 0 70px}.hero h1{font-size:48px}
  .feature-grid{grid-template-columns:1fr}.builder-grid,.day-grid{grid-template-columns:1fr}
  .week-grid{grid-template-columns:1fr 1fr}.summary-bar{grid-template-columns:1fr 1fr}
  #map{height:390px}.landing-preview-body{grid-template-columns:1fr}
}
@media(max-width:520px){
  .container{padding:0 16px}.hero h1{font-size:39px}.hero p.sub{font-size:16px}
  .week-grid{grid-template-columns:1fr}.form-2col{grid-template-columns:1fr}
  .nav{height:66px}.brand{font-size:17px}.nav-btn{padding:8px 10px}
}

</style>

</head>
<body>
<header class="site-header">
  <div class="container nav">
    <div class="brand" id="brand-home">
      <div class="brand-mark"><span>M</span></div>
      GoBlue Routes
    </div>
    <nav class="nav-links" id="nav-links"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="site-footer">
  GoBlue Routes is an independent student project and is not affiliated with, endorsed by, or sponsored by the University of Michigan.
  Travel times are estimates only.
</footer>

<script>
/* ==========================================================================
   GoBlue Routes — MVP
   ------------------------------------------------------------------------
   This file is organized to mirror the intended production module layout
   (see README). Sections below map to the following future file split:

     /data/buildings.ts     -> BUILDINGS
     /lib/routing.ts        -> RoutingService, getWalkingRoute()
     /lib/schedule.ts       -> ScheduleStore (localStorage)
     /lib/analysis.ts       -> analyzeDay(), analyzeWeek()
     /components/*          -> render__() functions
     /maps/*                -> MapView

   No backend. No account. Schedule data lives only in the browser
   (localStorage) unless the user clears it.
   ========================================================================== */

/* ---------------------------------------------------------------------- *
 * CONFIG  (mirrors what would come from process.env in Next.js)
 * ---------------------------------------------------------------------- */
const CONFIG = {
  // In a real deploy these come from NEXT_PUBLIC_MAPBOX_TOKEN etc.
  MAPBOX_TOKEN: null,

  // --------------------------------------------------------------------
  // ROUTING_PROVIDER_KEY
  // --------------------------------------------------------------------
  // Walking/pedestrian routing is provided by two chained providers (see
  // ROUTING_CONFIG + getWalkingRoute() below):
  //   1. A free, no-key OSRM instance that runs a real foot/pedestrian
  //      profile (routing.openstreetmap.de). Tried first, always.
  //   2. openrouteservice (openrouteservice.org), used ONLY if #1 fails
  //      or is unreachable, AND a key is set here.
  // If both fail, the app falls back to an estimated straight-line
  // calculation and labels it clearly as an estimate — it never shows a
  // straight line as if it were a real route.
  //
  // To enable the openrouteservice fallback:
  //   1. Sign up for a free key: https://openrouteservice.org/dev/#/signup
  //   2. Paste it below, e.g.  ROUTING_PROVIDER_KEY: "5b3ce3597851110001cf6248..."
  //   3. Do NOT commit a real key to a public repo. In production, proxy
  //      the request through your own backend (or an env var injected at
  //      build/deploy time) instead of shipping the key in frontend
  //      source that anyone can read in devtools.
  ROUTING_PROVIDER_KEY: null,

  OCR_API_KEY: null, // e.g. an AI/OCR provider for screenshot parsing
};

/* ---------------------------------------------------------------------- *
 * DATA: /data/buildings.js
 * Seed data for University of Michigan, Ann Arbor.
 * Coordinates are best-effort approximations for demo purposes and are
 * marked verifiedCoords:false where they have not been checked against
 * an authoritative source. Replace with verified data before relying on
 * this for real navigation.
 * ---------------------------------------------------------------------- */
const BUILDINGS = {
  "A&AB": { name:"Art & Architecture Building", aliases:["Art and Architecture"], campus:"North Campus", lat:42.290089, lng:-83.715635, verifiedCoords:false },
  "AH": { name:"Angell Hall", aliases:["LSA Building"], campus:"Central Campus", lat:42.27991, lng:-83.739441, verifiedCoords:false },
  "AL": { name:"Walter E. Lay Automotive Lab", aliases:["Automotive Lab"], campus:"North Campus", lat:42.294888, lng:-83.717643, verifiedCoords:false },
  "ALH": { name:"Alice Lloyd Hall", aliases:["Alice Lloyd"], campus:"The Hill", lat:42.282233, lng:-83.726756, verifiedCoords:false },
  "ARGUS2": { name:"Argus Building II, Television Center, 408 S. Fourth Street", aliases:[], campus:"Ann Arbor, Off Campus", lat:42.270806, lng:-83.752087, verifiedCoords:false },
  "ARGUS3": { name:"Argus Building III, 416 S. Fourth Street", aliases:[], campus:"Ann Arbor, Off Campus", lat:42.274899, lng:-83.751566, verifiedCoords:false },

function searchBuildings(query){
  const q = (query||"").trim().toLowerCase();
  if(!q) return [];
  return Object.entries(BUILDINGS)
    .filter(([code,b])=>{
      return code.toLowerCase().includes(q) ||
             b.name.toLowerCase().includes(q) ||
             b.aliases.some(a=>a.toLowerCase().includes(q));
    })
    .slice(0,8)
    .map(([code,b])=>({code,...b}));
}

/* ---------------------------------------------------------------------- *
 * LIB: /lib/routing.js
 * Real pedestrian routing, provider-swappable behind one async signature:
 *   getWalkingRoute(origin, destination) ->
 *     Promise<{distanceMeters, durationMin, geometry, estimated, unavailable}>
 *
 * Provider chain (each only tried if the previous one fails):
 *   1. OSRM_FOOT   — routing.openstreetmap.de/routed-foot. This is NOT the
 *      router.project-osrm.org demo server (that public instance is
 *      hardcoded to a driving profile no matter what profile you ask
 *      for). routing.openstreetmap.de is a separate, FOSSGIS-run public
 *      OSRM deployment that actually runs a foot/pedestrian profile, is
 *      free, and needs no API key. Suitable for light/demo traffic only
 *      (see https://routing.openstreetmap.de/about.html) — self-host
 *      OSRM with the foot profile for production load.
 *   2. ORS_FOOT    — openrouteservice's foot-walking profile. Only used
 *      if OSRM_FOOT fails/errors AND CONFIG.ROUTING_PROVIDER_KEY is set.
 *   3. ESTIMATED   — the old straight-line-plus-inefficiency-factor
 *      estimate, used only if both real providers fail. Always returned
 *      with estimated:true so callers can label it honestly instead of
 *      silently drawing it as a real route.
 * ---------------------------------------------------------------------- */
const WALK_SPEED_MPS = 1.34; // ~3 mph average adult walking pace, used only by the estimated fallback

const ROUTING_CONFIG = {
  OSRM_FOOT_URL: "https://routing.openstreetmap.de/routed-foot/route/v1/foot",
  ORS_FOOT_URL: "https://api.openrouteservice.org/v2/directions/foot-walking/geojson",
};

/* ---------------------------------------------------------------------- *
 * CAMPUS TRANSFER CONFIG
 * North Campus <-> Central Campus is a Blue Bus ride, not a walk — see
 * classifyTransition() below. These are the only two numbers to touch to
 * retune the estimate; nothing else in the app hardcodes 15/20.
 * ---------------------------------------------------------------------- */
const CAMPUS_TRANSFER_MIN = 15;
const CAMPUS_TRANSFER_MAX = 20;

// origin/destination -> resolved route. Avoids re-fetching the same
// building-to-building segment every time a view re-renders.
const routeCache = new Map();
function routeCacheKey(a,b){ return `${a.lat},${a.lng}|${b.lat},${b.lng}`; }

function haversineMeters(a,b){
  const R=6371000;
  const toRad = d=>d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat), dLng = toRad(b.lng-a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

async function fetchOSRMFootRoute(origin, destination){
  const url = `${ROUTING_CONFIG.OSRM_FOOT_URL}/${origin.lng},${origin.lat};${destination.lng},${destination.lat}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("OSRM foot request failed: "+res.status);
  const data = await res.json();
  if(data.code !== "Ok" || !data.routes || !data.routes.length) throw new Error("OSRM foot: no route found");
  const r = data.routes[0];
  return {
    distanceMeters: Math.round(r.distance),
    durationMin: Math.max(1, Math.round(r.duration/60)),
    geometry: r.geometry.coordinates.map(([lng,lat])=>[lat,lng]), // GeoJSON is [lng,lat]; Leaflet wants [lat,lng]
    estimated: false,
    unavailable: false,
    provider: "osrm-foot",
  };
}

async function fetchORSFootRoute(origin, destination){
  if(!CONFIG.ROUTING_PROVIDER_KEY) throw new Error("openrouteservice: no API key configured");
  const res = await fetch(ROUTING_CONFIG.ORS_FOOT_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": CONFIG.ROUTING_PROVIDER_KEY,
    },
    body: JSON.stringify({ coordinates: [[origin.lng,origin.lat],[destination.lng,destination.lat]] }),
  });
  if(!res.ok) throw new Error("openrouteservice request failed: "+res.status);
  const data = await res.json();
  const feature = data.features && data.features[0];
  if(!feature) throw new Error("openrouteservice: no route found");
  const summary = feature.properties.summary;
  return {
    distanceMeters: Math.round(summary.distance),
    durationMin: Math.max(1, Math.round(summary.duration/60)),
    geometry: feature.geometry.coordinates.map(([lng,lat])=>[lat,lng]),
    estimated: false,
    unavailable: false,
    provider: "ors-foot",
  };
}

// Fallback ONLY — reached if every real pedestrian routing provider
// fails (offline, rate-limited, no path found, etc). Assumes a straight
// line plus a small path-inefficiency factor. Always tagged
// estimated:true so the UI shows "Estimated route — walking directions
// unavailable." instead of quietly presenting it as a real route.
function estimateStraightLineRoute(origin, destination){
  const straight = haversineMeters(origin,destination);
  const PATH_INEFFICIENCY = 1.3;
  const distanceMeters = straight*PATH_INEFFICIENCY;
  const durationMin = Math.max(1, Math.round(distanceMeters/WALK_SPEED_MPS/60));
  return {
    distanceMeters: Math.round(distanceMeters),
    durationMin,
    geometry: [[origin.lat,origin.lng],[destination.lat,destination.lng]],
    estimated: true,
    unavailable: false,
  };
}

async function getWalkingRoute(origin, destination){
  if(!origin || !destination){
    return { distanceMeters:null, durationMin:null, geometry:[], estimated:true, unavailable:true };
  }
  if(origin.lat===destination.lat && origin.lng===destination.lng){
    return { distanceMeters:0, durationMin:0, geometry:[[origin.lat,origin.lng]], estimated:false, unavailable:false, provider:"same-building" };
  }
  const key = routeCacheKey(origin,destination);
  if(routeCache.has(key)) return routeCache.get(key);

  let route;
  try{
    route = await fetchOSRMFootRoute(origin, destination);
  }catch(errOSRM){
    try{
      route = await fetchORSFootRoute(origin, destination);
    }catch(errORS){
      route = estimateStraightLineRoute(origin, destination);
    }
  }
  routeCache.set(key, route);
  return route;
}

/* ---------------------------------------------------------------------- *
 * LIB: /lib/transitions.js
 * Classifies a building-to-building leg BEFORE any routing happens, so
 * the rest of the app (route calc, map, timeline, buffers, "Will I make
 * it?") all branch on one shared `type` instead of re-deriving campus
 * logic in five places. Source of truth for campus is building.campus —
 * no separate hardcoded North/Central list.
 *
 *   "walking"         same campus on both ends -> real pedestrian route
 *   "campus_transfer" North Campus <-> Central Campus -> Blue Bus estimate
 *   "unsupported"     any other cross-campus combo (Medical, The Hill,
 *                      Ross Athletic Campus, off-campus, ...) -> flagged,
 *                      never silently treated as a normal walk
 * ---------------------------------------------------------------------- */
const NORTH_CAMPUS = "North Campus";
const CENTRAL_CAMPUS = "Central Campus";

function classifyTransition(originB, destB){
  const campusA = originB.campus, campusB = destB.campus;
  if(campusA === campusB){
    return { type:"walking", campusA, campusB };
  }
  if(campusA === NORTH_CAMPUS && campusB === CENTRAL_CAMPUS){
    return { type:"campus_transfer", campusA, campusB, direction:"North → Central" };
  }
  if(campusA === CENTRAL_CAMPUS && campusB === NORTH_CAMPUS){
    return { type:"campus_transfer", campusA, campusB, direction:"Central → North" };
  }
  return { type:"unsupported", campusA, campusB };
}

// Synchronous — no network call. The campus-transfer estimate is a fixed
// range (CAMPUS_TRANSFER_MIN–MAX), not a per-building calculation, so
// there's nothing to fetch or cache. The conservative MAX value is what
// powers "Will I make it?"/buffer math; MIN is shown only as the low end
// of the displayed range.
function campusTransferSegment(direction){
  return {
    type:"campus_transfer",
    direction,
    minDurationMin: CAMPUS_TRANSFER_MIN,
    maxDurationMin: CAMPUS_TRANSFER_MAX,
    durationMin: CAMPUS_TRANSFER_MAX,
    estimated: true,
    geometry: null,
  };
}

/* ---------------------------------------------------------------------- *
 * LIB: /lib/schedule.js  — localStorage persistence

const ScheduleStore = {
  load(){

      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  },

  },
  clear(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} },

const DAY_ORDER = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_LABEL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

function uid(){ return "c_"+Math.random().toString(36).slice(2,10); }

function toMinutes(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  return h*60+m;
}
function fmtTime(hhmm){
  let [h,m] = hhmm.split(":").map(Number);
  const ampm = h>=12 ? "PM":"AM";
  h = h%12; if(h===0) h=12;
  return `${h}:${String(m).padStart(2,"0")} ${ampm}`;
}
function fmtMinutesAsClock(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return fmtTime(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`);
}

/* ---------------------------------------------------------------------- *
 * LIB: /lib/analysis.js
 * ---------------------------------------------------------------------- */
function classesForDay(classes, day){
  return classes
    .filter(c=>c.days.includes(day))
    .slice()
    .sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
}

function findOverlaps(dayClasses){
  const overlaps = [];
  for(let i=0;i<dayClasses.length-1;i++){
    const a=dayClasses[i], b=dayClasses[i+1];
    if(toMinutes(b.start) < toMinutes(a.end)){
      overlaps.push([a,b]);
    }
  }
  return overlaps;
}

// Synchronous: reads whatever routes are already in routeCache and marks
// anything not yet fetched as `loading`. This lets the schedule/timeline
// render immediately without waiting on the network — routing results
// stream in afterwards via fetchMissingRoutesForDay() + a re-render.
function analyzeDay(classes, day){
  const dayClasses = classesForDay(classes, day);
  const overlaps = findOverlaps(dayClasses);
  const overlappingIds = new Set(overlaps.flatMap(([a,b])=>[a.id,b.id]));

  const transitions = [];
  for(let i=0;i<dayClasses.length-1;i++){
    const prev = dayClasses[i], next = dayClasses[i+1];
    if(overlappingIds.has(prev.id) || overlappingIds.has(next.id)){
      transitions.push({ prev, next, skipped:true, reason:"overlap" });
      continue;
    }
    const originB = BUILDINGS[prev.building];
    const destB = BUILDINGS[next.building];
    if(!originB || !destB){
      const missingCode = !originB ? prev.building : next.building;
      const missingRec = BUILDINGS[missingCode];
      // In the catalog but genuinely missing lat/lng vs. not in the catalog at all.
      const reason = (missingRec && (missingRec.lat==null || missingRec.lng==null)) ? "no_coords" : "unknown_building";
      transitions.push({ prev, next, skipped:true, reason });
      continue;
    }

    const available = toMinutes(next.start) - toMinutes(prev.end);
    const cls = classifyTransition(originB, destB);

    // Cross-campus combo we don't have a real transit model for yet
    // (Medical, The Hill, Ross Athletic Campus, off-campus, ...). Flag
    // it plainly rather than pretending it's a normal walk.
    if(cls.type === "unsupported"){
      transitions.push({
        prev, next, skipped:true, reason:"unsupported_transfer",
        type:"unsupported", available, campusA:cls.campusA, campusB:cls.campusB,
      });
      continue;
    }

    if(cls.type === "campus_transfer"){
      // Fixed Blue Bus estimate — synchronous, no route fetch needed.
      const route = campusTransferSegment(cls.direction);
      const travel = route.durationMin; // conservative (MAX) estimate, per spec
      const buffer = available - travel;
      let status = "green", label = "Comfortable";
      if(buffer < -5){ status="red"; label="Won't make it"; }
      else if(buffer < 0){ status="red"; label="Very tight"; }
      else if(buffer < 5){ status="yellow"; label="Tight"; }
      const leaveByMin = toMinutes(next.start) - travel;
      transitions.push({
        prev, next, skipped:false, loading:false, type:"campus_transfer",
        available, travel, buffer, status, label,
        leaveBy: fmtMinutesAsClock(leaveByMin),
        sameBuilding:false, route,
      });
      continue;
    }

    // type === "walking" — real pedestrian routing, cached by lat/lng pair.
    const cached = routeCache.get(routeCacheKey(originB, destB));
    if(!cached){
      transitions.push({ prev, next, skipped:false, loading:true, type:"walking", available, originB, destB, sameBuilding: prev.building===next.building });
      continue;
    }

    const route = cached;
    const travel = route.durationMin ?? 0;
    const buffer = available - travel;
    let status = "green", label="Comfortable";
    if(buffer < 0){ status="red"; label="Very tight"; }
    else if(buffer < 5){ status="yellow"; label="Tight"; }
    const leaveByMin = toMinutes(next.start) - travel;
    transitions.push({
      prev, next, skipped:false, loading:false, type:"walking", available, travel, buffer, status, label,
      leaveBy: fmtMinutesAsClock(leaveByMin),
      sameBuilding: prev.building===next.building,
      route,
    });
  }

  const totalWalk = transitions.reduce((s,t)=> s + (t.skipped||t.loading?0:t.travel), 0);
  const tightCount = transitions.filter(t=>!t.skipped && !t.loading && (t.status==="yellow"||t.status==="red")).length;
  const campusTransferCount = transitions.filter(t=>t.type==="campus_transfer").length;
  const loadingCount = transitions.filter(t=>t.loading).length;

  return { day, dayClasses, transitions, overlaps, totalWalk, tightCount, campusTransferCount, classCount: dayClasses.length, loadingCount };
}

function analyzeWeek(classes){
  return DAY_ORDER.slice(0,5).map(day=>analyzeDay(classes, day));
}

/* ---------------------------------------------------------------------- *
 * Async route fetching. analyzeDay() itself stays synchronous (see
 * above); these functions fetch whatever routes are still missing for a
 * given day/week, one request per building-to-building segment, and
 * trigger a re-render only if the user is still looking at a view that
 * needs the result.
 * ---------------------------------------------------------------------- */
async function fetchMissingRoutesForDay(day){
  const analysis = analyzeDay(state.classes, day);
  const pending = analysis.transitions.filter(t=>t.loading);
  if(!pending.length) return false;
  // Each building-to-building leg is requested separately (EECS→LEC,
  // LEC→North Quad, ...) rather than one combined multi-stop request, so
  // each segment can be drawn/labeled independently and a failure on one
  // leg doesn't block the others.
  await Promise.all(pending.map(t=>getWalkingRoute(t.originB, t.destB)));
  return true;
}

function ensureRoutesForDay(day){
  fetchMissingRoutesForDay(day).then(changed=>{
    if(changed && state.view==="day" && state.activeDay===day) render();
  });
}

function ensureRoutesForWeek(){
  Promise.all(DAY_ORDER.slice(0,5).map(d=>fetchMissingRoutesForDay(d))).then(results=>{
    if(results.some(Boolean) && state.view==="weekly") render();
  });
}

  document.getElementById("f-end").addEventListener("input", e=> builderDraft.end = e.target.value);

  document.getElementById("save-class").addEventListener("click", saveClassFromDraft);
  document.getElementById("cancel-edit")?.addEventListener("click", ()=>{ resetDraft(); render(); });

  document.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = state.classes.find(x=>x.id===btn.dataset.edit);
      if(!c) return;
      const b = BUILDINGS[c.building];
      builderDraft = { course:c.course, building: b?b.name:(c.buildingRaw||c.building), buildingCode:c.building, room:c.room||"", days:[...c.days], start:c.start, end:c.end };
      state.editingId = c.id;
      render();
    });
  });
  document.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.classes = state.classes.filter(x=>x.id!==btn.dataset.del);
      persist();
      render();
    });
  });
}

function renderSuggestList(){
  const el = document.getElementById("suggest-list");
  if(!el) return;
  if(!buildingSuggestQuery || builderDraft.buildingCode){ el.innerHTML=""; el.className=""; return; }
  const results = searchBuildings(buildingSuggestQuery);
  if(!results.length){ el.innerHTML=""; el.className=""; return; }
  el.className = "suggest-list";
  el.innerHTML = results.map(r=>`<div class="suggest-item" data-code="${r.code}">${r.name} <small>${r.code} · ${r.campus}</small></div>`).join("");
  el.querySelectorAll(".suggest-item").forEach(item=>{
    item.addEventListener("click", ()=>{
      const code = item.dataset.code;
      builderDraft.buildingCode = code;
      builderDraft.building = BUILDINGS[code].name;
      document.getElementById("f-building").value = builderDraft.building;
      el.innerHTML=""; el.className="";
    });
  });
}

function saveClassFromDraft(){
  if(!builderDraft.course.trim()){ alert("Add a course name."); return; }
  if(!builderDraft.days.length){ alert("Select at least one day."); return; }
  if(!builderDraft.start || !builderDraft.end){ alert("Add a start and end time."); return; }
  if(toMinutes(builderDraft.end) <= toMinutes(builderDraft.start)){ alert("End time must be after start time."); return; }

  const record = {
    id: state.editingId || uid(),
    course: builderDraft.course.trim(),
    building: builderDraft.buildingCode || matchBuildingLoose(builderDraft.building) || "",
    buildingRaw: builderDraft.building,
    room: builderDraft.room.trim(),
    days: [...builderDraft.days],
    start: builderDraft.start,
    end: builderDraft.end,
  };

  if(state.editingId){
    state.classes = state.classes.map(c=> c.id===state.editingId ? record : c);
  }else{
    state.classes = [...state.classes, record];
  }
  persist();
  resetDraft();
  buildingSuggestQuery = "";
  render();
}

function matchBuildingLoose(text){
  if(!text) return "";
  const hit = searchBuildings(text)[0];
  return hit ? hit.code : "";
}

/* ---------------------------------------------------------------------- *
 * CSV import + confirm screen
 * ---------------------------------------------------------------------- */
function downloadCsvTemplate(){
  const csv = "course,building,room,days,start_time,end_time\nEECS 281,BBB,169,Mon;Wed,09:00,10:30\nMATH 214,East Hall,,Mon;Wed;Fri,12:00,13:00\n";
  const blob = new Blob([csv], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "goblue-routes-template.csv"; a.click();
  URL.revokeObjectURL(url);
}

function handleCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = parseCsv(reader.result);
      state.pendingImport = parsed;
      goto("confirm");
    }catch(err){
      alert("Couldn't read that CSV. Check it matches the template columns.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  const header = lines[0].split(",").map(h=>h.trim().toLowerCase());
  const idx = k => header.indexOf(k);
  const rows = lines.slice(1);
  return rows.map(line=>{
    const cells = line.split(",");
    const daysRaw = (cells[idx("days")]||"").trim();
    const days = daysRaw.split(/[;|]/).map(d=>normalizeDay(d.trim())).filter(Boolean);
    const buildingRaw = (cells[idx("building")]||"").trim();
    const code = matchBuildingLoose(buildingRaw) || (BUILDINGS[buildingRaw.toUpperCase()] ? buildingRaw.toUpperCase() : "");
    return {
      id: uid(),
      course: (cells[idx("course")]||"").trim(),
      buildingRaw,
      building: code,
      room: (cells[idx("room")]||"").trim(),
      days,
      start: normalizeTime((cells[idx("start_time")]||"").trim()),
      end: normalizeTime((cells[idx("end_time")]||"").trim()),
    };
  });
}

function normalizeDay(d){
  const map = {mon:"Mon",monday:"Mon",tue:"Tue",tues:"Tue",tuesday:"Tue",wed:"Wed",wednesday:"Wed",thu:"Thu",thur:"Thu",thurs:"Thu",thursday:"Thu",fri:"Fri",friday:"Fri",sat:"Sat",saturday:"Sat",sun:"Sun",sunday:"Sun"};
  return map[d.toLowerCase()] || "";
}
function normalizeTime(t){
  if(!t) return "";
  if(/^\d{1,2}:\d{2}$/.test(t)) return t.length===4? "0"+t : t;
  const m = t.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/i);
  if(m){
    let h = parseInt(m[1],10); const min=m[2]; const ap = m[3].toLowerCase();
    if(ap==="pm" && h!==12) h+=12;
    if(ap==="am" && h===12) h=0;
    return `${String(h).padStart(2,"0")}:${min}`;
  }
  return t;
}

/* ---------------------------------------------------------------------- *
 * VIEW: Day detail (timeline + map)
 * ---------------------------------------------------------------------- */
let leafletMap = null;

function renderDay(){
  const day = state.activeDay || "Mon";
  const analysis = analyzeDay(state.classes, day);
  return `
  <div class="container page">
    <div class="page-head">
      <div><h1>${DAY_LABEL[day]} ${state.isDemo?'<span class="badge-demo">DEMO DATA</span>':""}</h1><p>Your route for the day, building to building.</p></div>
    </div>
    <div class="day-tabs">
      ${DAY_ORDER.slice(0,5).map(d=>`<button class="day-tab ${d===day?"active":""}" data-day="${d}">${d}</button>`).join("")}
    </div>

    <div class="summary-bar">
      <div class="summary-tile"><div class="num">${analysis.classCount}</div><div class="lab">Classes</div></div>
      <div class="summary-tile"><div class="num">${analysis.classCount? "~"+analysis.totalWalk:"0"}</div><div class="lab">Walking (min)</div></div>
      <div class="summary-tile"><div class="num">${analysis.transitions.length}</div><div class="lab">Transitions</div></div>
      <div class="summary-tile"><div class="num">${analysis.tightCount}</div><div class="lab">Tight transitions</div></div>
    </div>

    ${analysis.overlaps.length ? `<div class="overlap-warning">⚠ ${analysis.overlaps.map(([a,b])=>`<b>${esc(a.course)}</b> and <b>${esc(b.course)}</b> overlap on ${DAY_LABEL[day]} — no route was calculated for that transition.`).join("<br/>")}</div>` : ""}

    ${analysis.classCount===0 ? `<div class="empty-state"><div class="big">🌤️</div>No classes on ${DAY_LABEL[day]}. Enjoy the free day.</div>` : `
    <div class="day-grid">
      <div class="timeline">
        ${analysis.dayClasses.map((c,i)=>{
          const b = BUILDINGS[c.building];
          const trans = analysis.transitions[i]; // transition AFTER this class
          return `
          <div class="class-block">
            <div class="time">${fmtTime(c.start)} – ${fmtTime(c.end)}</div>
            <div class="course">${esc(c.course)}</div>
            <div class="loc">${b? b.name : `<span class="tag-unknown">Unknown building: ${esc(c.buildingRaw||c.building||"—")}</span>`}${c.room? " · Rm "+esc(c.room):""}</div>
          </div>
          ${trans ? renderTransition(trans) : ""}
          `;
        }).join("")}
      </div>
      <div>
        <div id="map"></div>
        <p class="footnote">Estimated walking times — not live traffic or verified sidewalk routing. North ↔ Central legs show a Blue Bus transfer estimate (~15–20 min), not a walking route.</p>
      </div>
    </div>
    `}
  </div>`;
}

function renderTransition(t){
  if(t.skipped){
    let msg;
    if(t.reason==="overlap") msg = "Classes overlap — no route calculated.";
    else if(t.reason==="no_coords") msg = "Location coordinates unavailable.";
    else if(t.reason==="unsupported_transfer") msg = `${t.campusA} → ${t.campusB} isn't a route GoBlue Routes supports yet — check a map app for this one.`;
    else msg = "Unknown building — add/select a location to see this transition.";
    const cls = t.reason==="unsupported_transfer" ? "unsupported" : "yellow";
    return `<div class="transition ${cls}"><div class="headline">⚠ ${msg}</div></div>`;
  }
  if(t.loading){
    return `<div class="transition yellow">
      <div class="headline">⏳ Calculating walking route…</div>
      <div class="leaveby">${t.available} min available between classes</div>
    </div>`;
  }

  if(t.type==="campus_transfer"){
    const icon = t.status==="green" ? "✓" : t.status==="yellow" ? "⚠" : (t.label==="Won't make it" ? "🚨" : "⛔");
    const headline = t.label==="Won't make it"
      ? `🚨 You likely won't make this transition`
      : `${icon} ${t.label} — ${t.available} min available, ~${t.route.minDurationMin}–${t.route.maxDurationMin} min bus transfer`;
    return `
    <div class="transition campus-transfer ${t.status}">
      <div class="headline"><span class="bus-badge">🚌 ${t.route.direction}</span>${headline}</div>
      <div class="leaveby">~${t.route.maxDurationMin} min needed (conservative estimate) · ${t.buffer>=0? t.buffer+" min buffer" : Math.abs(t.buffer)+" min short"} · Leave ${esc(t.prev.building?BUILDINGS[t.prev.building].name:"")} by ${t.leaveBy} · Michigan Blue Bus</div>
    </div>`;
  }

  const icon = t.status==="green" ? "✓" : t.status==="yellow" ? "⚠" : "⛔";
  const sameNote = t.sameBuilding ? " (same building)" : "";
  const estimatedNote = t.route && t.route.estimated ? " · Estimated route — walking directions unavailable." : "";
  return `
  <div class="transition ${t.status}">
    <div class="headline">${icon} ${t.label} — ${t.available} min available, ~${t.travel} min walk${sameNote}</div>
    <div class="leaveby">${t.travel} min walk · ${t.buffer>=0? t.buffer+" min buffer" : Math.abs(t.buffer)+" min short"} · Leave ${esc(t.prev.building?BUILDINGS[t.prev.building].name:"")} by ${t.leaveBy}${estimatedNote}</div>
  </div>`;
}

function wireDay(){
  document.querySelectorAll(".day-tab").forEach(tab=>{
    tab.addEventListener("click", ()=> goto("day", {activeDay: tab.dataset.day}));
  });
  initMap();
  ensureRoutesForDay(state.activeDay || "Mon");
}

function initMap(){
  const day = state.activeDay || "Mon";
  const analysis = analyzeDay(state.classes, day);
  const container = document.getElementById("map");
  if(!container) return;

  if(typeof L === "undefined"){
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#a9bcd1;font-size:14px;padding:20px;text-align:center;background:#0f2842;border-radius:16px;">
      Map library failed to load (no network access to the map tile CDN). Timeline and travel-time estimates below still work.</div>`;
    return;
  }

  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map("map", {scrollWheelZoom:true});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:"&copy; OpenStreetMap contributors"
  }).addTo(leafletMap);

  const points = analysis.dayClasses
    .map(c=>BUILDINGS[c.building])
    .filter(Boolean);

  if(points.length===0){
    leafletMap.setView([42.2808,-83.7382], 15); // default: central campus
    return;
  }

  // Bounds start as just the building markers, then grow to include
  // actual route geometry once segments are drawn below — so the map
  // frames the real walked path, not just the endpoints.
  const boundsPoints = [];
  points.forEach((b,i)=>{
    const marker = L.circleMarker([b.lat,b.lng], {
      radius:13, weight:2, color:"#153a5c", fillColor: i===0? "#ffcb05":"#2a628f", fillOpacity:1
    }).addTo(leafletMap);
    marker.bindTooltip(`${i+1}. ${b.name}`, {permanent:false, direction:"top"});
    L.marker([b.lat,b.lng], {
      icon: L.divIcon({
        className: "",
        html: `<div style="font:800 11px 'Space Mono',ui-monospace,monospace;color:${i===0?"#071a2c":"#f4f7fb"};transform:translate(-50%,-50%);pointer-events:none;text-align:center;">${i+1}</div>`,
        iconSize: [0,0],
      }),
    }).addTo(leafletMap);
    boundsPoints.push([b.lat,b.lng]);
  });

  // Draw each building-to-building leg using its own fetched route
  // geometry (real pedestrian path when available). Segments still
  // loading are intentionally NOT drawn as a straight line — the
  // timeline shows "Calculating walking route…" for those instead, and
  // they'll appear here once resolved. Segments that fell back to the
  // estimate are drawn distinctly (thinner, dashed, red) so a straight
  // line is never mistaken for a real route.
  analysis.transitions.forEach(t=>{
    // Unsupported cross-campus combos (Medical, The Hill, Ross Athletic
    // Campus, off-campus, ...) get no line at all — drawing anything
    // here would imply a route we don't actually model. The two
    // buildings still show as plain numbered markers above.
    if(t.skipped || t.loading) return;

    if(t.type === "campus_transfer"){
      const originB = BUILDINGS[t.prev.building], destB = BUILDINGS[t.next.building];
      if(!originB || !destB) return;
      const segment = [[originB.lat,originB.lng],[destB.lat,destB.lng]];
      // Deliberately NOT a pedestrian route — a dashed Michigan
      // blue/maize line with a bus glyph, visually distinct from the
      // solid maize walking line so it's never mistaken for "just walk
      // it". This straight segment stands in for the bus link between
      // the two campus areas; it is never fed into walking-time math.
      L.polyline(segment, {color:"#ffcb05", weight:4, opacity:.85, dashArray:"2 10", lineCap:"round"}).addTo(leafletMap);
      L.polyline(segment, {color:"#2a628f", weight:4, opacity:.85, dashArray:"2 10", dashOffset:"6", lineCap:"round"}).addTo(leafletMap);
      const mid = [(originB.lat+destB.lat)/2, (originB.lng+destB.lng)/2];
      L.marker(mid, {
        icon: L.divIcon({
          className:"",
          html:`<div style="font-size:18px;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));">🚌</div>`,
          iconSize:[0,0],
        }),
      }).bindTooltip(`Campus transfer · ${t.route.direction} · ~${t.route.minDurationMin}–${t.route.maxDurationMin} min`, {permanent:false, direction:"top"}).addTo(leafletMap);
      segment.forEach(pt=>boundsPoints.push(pt));
      return;
    }

    const route = t.route;
    if(!route || !route.geometry || route.geometry.length<2) return;
    const style = route.estimated
      ? {color:"#ff9494", weight:4, opacity:.8, dashArray:"5 8"}
      : {color:"#ffcb05", weight:5, opacity:.92, lineJoin:"round"};
    L.polyline(route.geometry, style).addTo(leafletMap);
    route.geometry.forEach(pt=>boundsPoints.push(pt));
  });

  leafletMap.fitBounds(boundsPoints, {padding:[40,40]});
  if(boundsPoints.length===1) leafletMap.setView(boundsPoints[0], 16);
}

/* ---------------------------------------------------------------------- *
 * ROOT RENDER
 * ---------------------------------------------------------------------- */
function render(){
  renderNav();
  const app = document.getElementById("app");
  switch(state.view){
    case "landing": app.innerHTML = renderLanding(); wireLanding(); break;
    case "builder": app.innerHTML = renderBuilder(); wireBuilder(); break;
    case "confirm": app.innerHTML = renderConfirm(); wireConfirm(); break;
    case "weekly": app.innerHTML = renderWeekly(); wireWeekly(); break;
    case "day": app.innerHTML = renderDay(); wireDay(); break;
  }
  renderModal();
}

// Boot: if a schedule already exists in localStorage, skip landing.
if(state.classes.length){ state.view = "weekly"; }
render();
